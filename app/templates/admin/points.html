{% extends "admin/base.html" %}

{% block title %}积分管理 - 管理后台{% endblock %}

{% block content %}
<div class="container-fluid">
    <h1 class="h3 mb-4 text-gray-800">积分管理</h1>

    <!-- 积分概览卡片 -->
    <div class="row">
        <div class="col-xl-4 col-md-6 mb-4">
            <div class="card border-left-primary shadow h-100 py-2">
                <div class="card-body">
                    <div class="row no-gutters align-items-center">
                        <div class="col mr-2">
                            <div class="text-xs font-weight-bold text-primary text-uppercase mb-1">系统总积分</div>
                            <div class="h5 mb-0 font-weight-bold text-gray-800" id="totalPoints">加载中...</div>
                        </div>
                        <div class="col-auto">
                            <i class="fas fa-coins fa-2x text-gray-300"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-xl-4 col-md-6 mb-4">
            <div class="card border-left-success shadow h-100 py-2">
                <div class="card-body">
                    <div class="row no-gutters align-items-center">
                        <div class="col mr-2">
                            <div class="text-xs font-weight-bold text-success text-uppercase mb-1">有效积分</div>
                            <div class="h5 mb-0 font-weight-bold text-gray-800" id="activePoints">加载中...</div>
                        </div>
                        <div class="col-auto">
                            <i class="fas fa-check-circle fa-2x text-gray-300"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-xl-4 col-md-6 mb-4">
            <div class="card border-left-warning shadow h-100 py-2">
                <div class="card-body">
                    <div class="row no-gutters align-items-center">
                        <div class="col mr-2">
                            <div class="text-xs font-weight-bold text-warning text-uppercase mb-1">已过期积分</div>
                            <div class="h5 mb-0 font-weight-bold text-gray-800" id="expiredPoints">加载中...</div>
                        </div>
                        <div class="col-auto">
                            <i class="fas fa-clock fa-2x text-gray-300"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 积分操作区 -->
    <div class="row mb-4">
        <div class="col-lg-6">
            <div class="card shadow mb-4">
                <div class="card-header py-3">
                    <h6 class="m-0 font-weight-bold text-primary">积分操作</h6>
                </div>
                <div class="card-body">
                    <form id="pointsOperationForm">
                        <div class="form-group">
                            <label for="userEmail">用户邮箱</label>
                            <input type="email" class="form-control" id="userEmail" required>
                        </div>
                        <div class="form-group">
                            <label for="points">积分数量</label>
                            <input type="number" class="form-control" id="points" required>
                        </div>
                        <div class="form-group">
                            <label for="description">说明</label>
                            <input type="text" class="form-control" id="description">
                        </div>
                        <div class="form-group">
                            <label for="expiresInDays">过期天数（可选）</label>
                            <input type="number" class="form-control" id="expiresInDays">
                        </div>
                        <button type="button" class="btn btn-success mr-2" onclick="addPoints()">添加积分</button>
                        <button type="button" class="btn btn-danger" onclick="deductPoints()">扣除积分</button>
                    </form>
                </div>
            </div>
        </div>
        <div class="col-lg-6">
            <div class="card shadow mb-4">
                <div class="card-header py-3">
                    <h6 class="m-0 font-weight-bold text-primary">积分过期管理</h6>
                </div>
                <div class="card-body">
                    <p>手动触发积分过期检查（通常由系统自动执行）</p>
                    <button type="button" class="btn btn-warning" onclick="triggerPointsExpiration()">
                        执行积分过期
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 用户积分历史记录 -->
    <div class="card shadow mb-4">
        <div class="card-header py-3 d-flex justify-content-between align-items-center">
            <h6 class="m-0 font-weight-bold text-primary">积分历史记录</h6>
            <div class="d-flex align-items-center">
                <div class="input-group" style="width: 300px;">
                    <input type="email" class="form-control" id="searchUserEmail" placeholder="输入用户邮箱搜索">
                    <div class="input-group-append">
                        <button class="btn btn-primary" type="button" onclick="searchUserHistory()">
                            <i class="fas fa-search fa-sm"></i>
                        </button>
                    </div>
                </div>
                <button class="btn btn-secondary ml-2" type="button" onclick="clearHistory()">
                    <i class="fas fa-times fa-sm"></i> 清除记录
                </button>
            </div>
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-bordered" id="pointsHistoryTable" width="100%" cellspacing="0">
                    <thead>
                        <tr>
                            <th>用户邮箱</th>
                            <th>用户名</th>
                            <th>积分变动</th>
                            <th>类型</th>
                            <th>说明</th>
                            <th>过期时间</th>
                            <th>创建时间</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- 数据将通过JavaScript动态加载 -->
                    </tbody>
                </table>
                <!-- 分页控件 -->
                <nav aria-label="Page navigation">
                    <ul class="pagination justify-content-center" id="pagination">
                    </ul>
                </nav>
            </div>
        </div>
    </div>
</div>

{% endblock %}

{% block scripts %}
<script>
let currentPage = 1;
let currentEmail = '';

// 加载积分概览数据
function loadPointsOverview() {
    fetch('/admin/api/points_overview')
        .then(response => {
            if (!response.ok) {
                return response.json().then(err => Promise.reject(err));
            }
            return response.json();
        })
        .then(data => {
            console.log('Received history data:', data);
            document.getElementById('totalPoints').textContent = data.total_points;
            document.getElementById('activePoints').textContent = data.active_points;
            document.getElementById('expiredPoints').textContent = data.expired_points;
        })
        .catch(error => {
            console.error('Error:', error);
            const tbody = document.querySelector('#pointsHistoryTable tbody');
            tbody.innerHTML = '<tr><td colspan="7" class="text-center text-danger">加载失败，请重试</td></tr>';
            showMessage('错误', '加载历史记录失败：' + (error.error || '未知错误'), 'error');
        });
}

// 添加积分
function addPoints() {
    const email = document.getElementById('userEmail').value;
    const points = parseInt(document.getElementById('points').value);
    const description = document.getElementById('description').value;
    const expiresInDays = document.getElementById('expiresInDays').value || null;

    console.log('Adding points:', { email, points, description, expiresInDays });

    const data = {
        email: email,
        points: points,
        description: description,
        expires_in_days: expiresInDays
    };

    fetch('/admin/api/add_points', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
        },
        body: JSON.stringify(data)
    })
    .then(response => {
        if (!response.ok) {
            return response.json().then(err => Promise.reject(err));
        }
        return response.json();
    })
    .then(data => {
        showMessage('成功', '积分添加成功', 'success');
        loadPointsOverview(); // 重新加载积分概览

        // 如果当前正在查看该用户的历史记录，则刷新历史记录
        if (currentEmail === document.getElementById('userEmail').value) {
            loadUserHistory(currentEmail, currentPage);
        } else {
            // 加载当前操作用户的历史记录
            currentEmail = document.getElementById('userEmail').value;
            loadUserHistory(currentEmail, 1);
        }

        // 清空表单
        document.getElementById('points').value = '';
        document.getElementById('description').value = '';
        document.getElementById('expiresInDays').value = '';
    })
    .catch(error => {
        console.error('Error:', error);
        showMessage('错误', '操作失败：' + (error.error || '未知错误'), 'error');
    });
}

// 扣除积分
function deductPoints() {
    const email = document.getElementById('userEmail').value;
    const points = parseInt(document.getElementById('points').value);
    const description = document.getElementById('description').value;

    console.log('Deducting points:', { email, points, description });

    const data = {
        email: email,
        points: points,
        description: description
    };

    fetch('/admin/api/deduct_points', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
        },
        body: JSON.stringify(data)
    })
    .then(response => {
        if (!response.ok) {
            return response.json().then(err => Promise.reject(err));
        }
        return response.json();
    })
    .then(data => {
        showMessage('成功', '积分扣除成功', 'success');
        loadPointsOverview(); // 重新加载积分概览

        // 如果当前正在查看该用户的历史记录，则刷新历史记录
        if (currentEmail === document.getElementById('userEmail').value) {
            loadUserHistory(currentEmail, currentPage);
        } else {
            // 加载当前操作用户的历史记录
            currentEmail = document.getElementById('userEmail').value;
            loadUserHistory(currentEmail, 1);
        }

        // 清空表单
        document.getElementById('points').value = '';
        document.getElementById('description').value = '';
    })
    .catch(error => {
        console.error('Error:', error);
        showMessage('错误', '操作失败：' + (error.error || '未知错误'), 'error');
    });
}

// 触发积分过期
function triggerPointsExpiration() {
    if (!confirm('确定要执行积分过期操作吗？')) {
        return;
    }

    fetch('/admin/api/expire_points', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
        }
    })
    .then(response => response.json())
    .then(data => {
        showMessage('成功', `积分过期操作完成，共过期 ${data.expired_count} 条记录`, 'success');
        loadPointsOverview();
        if (currentEmail) {
            loadUserHistory(currentEmail, currentPage);
        }
    })
    .catch(error => {
        console.error('Error:', error);
        alert('操作失败：' + error.message);
    });
}

// 加载用户积分历史
function loadUserHistory(email, page = 1) {
    currentEmail = email;
    currentPage = page;

    // 保存当前查看的用户邮箱
    saveCurrentEmail(email);

    console.log('Loading history for email:', email, 'page:', page);

    // 显示加载状态
    const tbody = document.querySelector('#pointsHistoryTable tbody');
    tbody.innerHTML = '<tr><td colspan="7" class="text-center">加载中...</td></tr>';

    fetch(`/admin/api/user_points_history_by_email/${email}?page=${page}`)
        .then(response => response.json())
        .then(data => {
            const tbody = document.querySelector('#pointsHistoryTable tbody');
            tbody.innerHTML = '';

            data.items.forEach(item => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${item.email}</td>
                    <td>${item.username}</td>
                    <td>${item.points}</td>
                    <td>${item.transaction_type}</td>
                    <td>${item.description || '-'}</td>
                    <td>${item.expires_at || '-'}</td>
                    <td>${new Date(item.created_at).toLocaleString()}</td>
                `;
                tbody.appendChild(row);
            });

            // 更新分页
            updatePagination(data.page, data.pages);
        })
        .catch(error => console.error('Error:', error));
}

// 更新分页控件
function updatePagination(currentPage, totalPages) {
    const pagination = document.getElementById('pagination');
    pagination.innerHTML = '';

    // 上一页
    const prevLi = document.createElement('li');
    prevLi.className = `page-item ${currentPage === 1 ? 'disabled' : ''}`;
    prevLi.innerHTML = `
            <a class="page-link" href="#" onclick="loadUserHistory('${currentEmail}', ${currentPage - 1})">
            上一页
        </a>
    `;
    pagination.appendChild(prevLi);

    // 页码
    for (let i = 1; i <= totalPages; i++) {
        const li = document.createElement('li');
        li.className = `page-item ${i === currentPage ? 'active' : ''}`;
        li.innerHTML = `
            <a class="page-link" href="#" onclick="loadUserHistory('${currentEmail}', ${i})">
                ${i}
            </a>
        `;
        pagination.appendChild(li);
    }

    // 下一页
    const nextLi = document.createElement('li');
    nextLi.className = `page-item ${currentPage === totalPages ? 'disabled' : ''}`;
    nextLi.innerHTML = `
            <a class="page-link" href="#" onclick="loadUserHistory('${currentEmail}', ${currentPage + 1})">
            下一页
        </a>
    `;
    pagination.appendChild(nextLi);
}

// 搜索用户历史
function searchUserHistory() {
    const email = document.getElementById('searchUserEmail').value;
    if (!email) {
        showMessage('错误', '请输入用户邮箱', 'error');
        return;
    }
    if (!email.includes('@')) {
        showMessage('错误', '请输入有效的邮箱地址', 'error');
        return;
    }
    console.log('Searching history for email:', email);
    loadUserHistory(email, 1);
}

// 清除历史记录
function clearHistory() {
    clearSavedEmail();
    document.getElementById('searchUserEmail').value = '';
    document.querySelector('#pointsHistoryTable tbody').innerHTML = '';
    document.getElementById('pagination').innerHTML = '';
    currentEmail = '';
    currentPage = 1;
    showMessage('成功', '历史记录已清除', 'success');
}

// 保存当前查看的用户邮箱到本地存储
function saveCurrentEmail(email) {
    if (email) {
        localStorage.setItem('currentPointsUserEmail', email);
    }
}

// 从本地存储获取用户邮箱
function getSavedEmail() {
    return localStorage.getItem('currentPointsUserEmail');
}

// 清除保存的邮箱
function clearSavedEmail() {
    localStorage.removeItem('currentPointsUserEmail');
}

// 页面加载完成后执行
document.addEventListener('DOMContentLoaded', function() {
    loadPointsOverview();

    // 检查是否有保存的用户邮箱，如果有则加载该用户的历史记录
    const savedEmail = getSavedEmail();
    if (savedEmail) {
        console.log('Found saved email:', savedEmail);
        document.getElementById('searchUserEmail').value = savedEmail;
        loadUserHistory(savedEmail, 1);
    }
});
</script>
{% endblock %}
