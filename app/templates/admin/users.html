{% extends "admin/base.html" %}

{% block title %}管理后台 - 会员管理{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1>会员管理</h1>
</div>

<div class="card mb-4">
    <div class="card-body">
        <div class="row">
            <div class="col-md-3">
                <input type="text" class="form-control" id="search-username" placeholder="搜索用户名">
            </div>
            <div class="col-md-3">
                <input type="text" class="form-control" id="search-email" placeholder="搜索邮箱">
            </div>
            <div class="col-md-2">
                <select class="form-select" id="filter-status">
                    <option value="">所有状态</option>
                    <option value="true">已激活</option>
                    <option value="false">已停用</option>
                </select>
            </div>
            <div class="col-md-2">
                <button class="btn btn-primary" onclick="searchUsers()">
                    <i class="fas fa-search"></i> 搜索
                </button>
            </div>
        </div>
    </div>
</div>

<div class="table-responsive">
    <table class="table table-striped">
        <thead>
            <tr>
                <th>用户名</th>
                <th>邮箱</th>
                <th>会员等级</th>
                <th>积分余额</th>
                <th>状态</th>
                <th>注册时间</th>
                <th>操作</th>
            </tr>
        </thead>
        <tbody id="users-table-body">
            <!-- 用户数据将通过 JavaScript 动态加载 -->
        </tbody>
    </table>
</div>

<nav>
    <ul class="pagination justify-content-center" id="pagination">
        <!-- 分页将通过 JavaScript 动态加载 -->
    </ul>
</nav>
{% endblock %}

{% block extra_js %}
<script>
let currentPage = 1;
const perPage = 20;

function searchUsers() {
    loadUsers({
        page: currentPage,
        username: $('#search-username').val(),
        email: $('#search-email').val(),
        status: $('#filter-status').val()
    });
}

function loadUsers(params = {}) {
    const queryParams = new URLSearchParams({
        page: params.page || 1,
        per_page: perPage,
        ...params
    });

    $.get(`/admin/api/users?${queryParams.toString()}`)
        .done(function(response) {
            updateUsersTable(response.items);
            updatePagination(response.total, response.pages);
        })
        .fail(function(error) {
            alert('加载用户数据失败');
            console.error('Error:', error);
        });
}

function updateUsersTable(users) {
    const tbody = $('#users-table-body');
    tbody.empty();

    users.forEach(user => {
        tbody.append(`
            <tr>
                <td>${user.username}</td>
                <td>${user.email}</td>
                <td>${user.membership_level}</td>
                <td>${user.points_balance}</td>
                <td>
                    <span class="badge bg-${user.is_active ? 'success' : 'danger'}">
                        ${user.is_active ? '已激活' : '已停用'}
                    </span>
                </td>
                <td>${new Date(user.created_at).toLocaleString()}</td>
                <td>
                    <button class="btn btn-sm btn-${user.is_active ? 'danger' : 'success'}"
                            onclick="toggleUserStatus('${user.id}', ${!user.is_active})">
                        ${user.is_active ? '停用' : '激活'}
                    </button>
                    <button class="btn btn-sm btn-info" onclick="editUser('${user.id}')">
                        编辑
                    </button>
                </td>
            </tr>
        `);
    });
}

function updatePagination(total, pages) {
    const pagination = $('#pagination');
    pagination.empty();

    if (pages <= 1) return;

    // 添加上一页按钮
    pagination.append(`
        <li class="page-item ${currentPage === 1 ? 'disabled' : ''}">
            <a class="page-link" href="#" onclick="changePage(${currentPage - 1})">上一页</a>
        </li>
    `);

    // 添加页码按钮
    for (let i = 1; i <= pages; i++) {
        if (i === 1 || i === pages || (i >= currentPage - 2 && i <= currentPage + 2)) {
            pagination.append(`
                <li class="page-item ${i === currentPage ? 'active' : ''}">
                    <a class="page-link" href="#" onclick="changePage(${i})">${i}</a>
                </li>
            `);
        } else if (i === currentPage - 3 || i === currentPage + 3) {
            pagination.append(`
                <li class="page-item disabled">
                    <span class="page-link">...</span>
                </li>
            `);
        }
    }

    // 添加下一页按钮
    pagination.append(`
        <li class="page-item ${currentPage === pages ? 'disabled' : ''}">
            <a class="page-link" href="#" onclick="changePage(${currentPage + 1})">下一页</a>
        </li>
    `);
}

function changePage(page) {
    if (page < 1) return;
    currentPage = page;
    searchUsers();
}

function toggleUserStatus(userId, activate) {
    const action = activate ? 'activate' : 'deactivate';
    $.ajax({
        url: `/admin/api/users/${userId}/${action}`,
        method: 'PUT',
        success: function() {
            searchUsers();
        },
        error: function(error) {
            alert('操作失败');
            console.error('Error:', error);
        }
    });
}

function editUser(userId) {
    // TODO: 实现用户编辑功能
    alert('编辑用户功能开发中');
}

// 页面加载时加载用户数据
$(document).ready(function() {
    searchUsers();
});
</script>
{% endblock %}
