<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>积分商城系统</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header>
        <h1>积分商城系统</h1>
    </header>
    <nav>
        <ul>
            <li><a href="{{ url_for('index') }}" id="home-link" class="active">首页</a></li>
            <li><a href="{{ url_for('products') }}" id="products-link">商品</a></li>
            <li><a href="{{ url_for('points') }}" id="points-link">我的积分</a></li>
            <li><a href="{{ url_for('orders') }}" id="orders-link">我的订单</a></li>
            <li><a href="{{ url_for('user_center') }}" id="user-center-link">个人中心</a></li>
        </ul>
    </nav>
    <div class="container">
        <div class="login-section" id="login-section">
            <h2>用户登录</h2>
            <form class="login-form" id="login-form">
                <input type="email" placeholder="邮箱" id="email" required>
                <input type="password" placeholder="密码" id="password" required>
                <button type="submit">登录</button>
            </form>
            <p>没有账号？<a href="{{ url_for('register') }}" id="register-link">注册</a></p>
        </div>
        <div class="user-info" id="user-info" style="display: none;">
            <h2>用户信息</h2>
            <p>用户名: <span id="username"></span></p>
            <p>积分余额: <span id="points-balance"></span></p>
            <button id="logout-btn">退出登录</button>
        </div>
        <div class="hero">
            <h2>欢迎来到积分商城</h2>
            <p>在这里，您可以使用积分兑换各种精美商品</p>
        </div>

        <!-- 商品筛选区域 -->
        <div class="filter-section mb-4">
            <div class="row g-3">
                <div class="col-md-3">
                    <input type="text" class="form-control" id="search-keyword" placeholder="搜索商品">
                </div>
                <div class="col-md-3">
                    <select class="form-select" id="filter-category">
                        <option value="">所有分类</option>
                        <!-- 分类选项将通过 JavaScript 动态加载 -->
                    </select>
                </div>
                <div class="col-md-3">
                    <button class="btn btn-primary" onclick="searchProducts()">
                        <i class="fas fa-search"></i> 搜索
                    </button>
                </div>
            </div>
        </div>

        <h2>热门商品</h2>
        <div class="products" id="products-container">
            <!-- 商品将通过 JavaScript 动态加载 -->
        </div>

        <!-- 分页导航 -->
        <nav aria-label="商品分页" class="mt-4">
            <ul class="pagination justify-content-center" id="pagination">
                <!-- 分页将通过 JavaScript 动态加载 -->
            </ul>
        </nav>
    </div>
    <footer>
        <p>&copy; 2025 积分商城系统. 保留所有权利.</p>
    </footer>

    <!-- 引入共享的认证脚本 -->
    <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
    <script>
        // 获取商品列表
        async function fetchProducts() {
            try {
                const response = await fetch(`${API_BASE_URL}/api/products`);
                if (response.ok) {
                    const data = await response.json();
                    renderProducts(data.products);
                }
            } catch (error) {
                console.error('获取商品列表失败:', error);
                renderDemoProducts(); // 使用示例数据
            }
        }

        // 渲染商品列表
        function renderProducts(products) {
            const container = document.getElementById('products-container');

            // 清空容器
            container.innerHTML = '';

            if (!products || products.length === 0) {
                container.innerHTML = '<p class="text-center">暂无商品数据</p>';
                return;
            }

            // 添加商品卡片
            products.forEach(product => {
                if (!product.is_active) return; // 只显示已上架的商品

                const card = document.createElement('div');
                card.className = 'product-card';

                const promotionText = product.active_promotions && product.active_promotions.length > 0
                    ? `<span class="badge bg-danger">促销中</span>`
                    : '';

                const priceDisplay = product.cash_price
                    ? `<p class="cash-price">现金价格: ¥${product.cash_price}</p>`
                    : '';

                card.innerHTML = `
                    <div class="product-image">
                        <img src="${product.image_url || 'https://via.placeholder.com/150'}" alt="${product.name}">
                        ${promotionText}
                    </div>
                    <div class="product-info">
                        <h3>${product.name}</h3>
                        <p class="description">${product.description || ''}</p>
                        <p class="points">所需积分: ${product.points_price}</p>
                        ${priceDisplay}
                        <p class="stock ${product.stock > 0 ? 'in-stock' : 'out-stock'}">
                            ${product.stock > 0 ? `库存: ${product.stock}` : '暂时缺货'}
                        </p>
                        <div class="product-actions">
                            <button class="btn btn-outline-primary" onclick="viewProductDetail('${product.id}')">
                                查看详情
                            </button>
                            ${product.stock > 0 ? `
                                <button class="btn btn-primary" onclick="showExchangeModal('${product.id}', '${product.name}', ${product.points_price}, ${product.stock})">
                                    立即兑换
                                </button>
                            ` : ''}
                        </div>
                    </div>
                `;

                container.appendChild(card);
            });
        }

        let currentPage = 1;
        const perPage = 12; // 每页显示12个商品

        // 获取商品分类
        async function fetchCategories() {
            try {
                const response = await fetch(`${API_BASE_URL}/api/products/categories`);
                if (response.ok) {
                    const categories = await response.json();
                    const select = document.getElementById('filter-category');
                    categories.forEach(category => {
                        const option = document.createElement('option');
                        option.value = category;
                        option.textContent = category;
                        select.appendChild(option);
                    });
                }
            } catch (error) {
                console.error('获取分类失败:', error);
            }
        }

        // 搜索商品
        function searchProducts() {
            currentPage = 1;
            fetchProducts();
        }

        // 更新分页
        function updatePagination(total, pages) {
            const pagination = document.getElementById('pagination');
            pagination.innerHTML = '';

            if (pages <= 1) return;

            // 上一页
            const prevLi = document.createElement('li');
            prevLi.className = `page-item ${currentPage === 1 ? 'disabled' : ''}`;
            prevLi.innerHTML = `<a class="page-link" href="#" onclick="changePage(${currentPage - 1})">上一页</a>`;
            pagination.appendChild(prevLi);

            // 页码
            for (let i = 1; i <= pages; i++) {
                if (i === 1 || i === pages || (i >= currentPage - 2 && i <= currentPage + 2)) {
                    const li = document.createElement('li');
                    li.className = `page-item ${i === currentPage ? 'active' : ''}`;
                    li.innerHTML = `<a class="page-link" href="#" onclick="changePage(${i})">${i}</a>`;
                    pagination.appendChild(li);
                } else if (i === currentPage - 3 || i === currentPage + 3) {
                    const li = document.createElement('li');
                    li.className = 'page-item disabled';
                    li.innerHTML = '<span class="page-link">...</span>';
                    pagination.appendChild(li);
                }
            }

            // 下一页
            const nextLi = document.createElement('li');
            nextLi.className = `page-item ${currentPage === pages ? 'disabled' : ''}`;
            nextLi.innerHTML = `<a class="page-link" href="#" onclick="changePage(${currentPage + 1})">下一页</a>`;
            pagination.appendChild(nextLi);
        }

        // 切换页码
        function changePage(page) {
            if (page < 1) return;
            currentPage = page;
            fetchProducts();
        }

        // 查看商品详情
        function viewProductDetail(productId) {
            window.location.href = `/product/${productId}`;
        }

        // 显示兑换模态框
        function showExchangeModal(productId, productName, pointsPrice, stock) {
            // TODO: 实现兑换模态框
            alert('兑换功能开发中...');
        }

        // 页面加载完成后执行
        document.addEventListener('DOMContentLoaded', function() {
            fetchCategories();
            fetchProducts();
        });
    </script>
</body>
</html>
